<title>Global Dominion</title>
<style>
:root{--sea:#dbe6f0;--land:#cfd6de;--bd:rgba(20,30,50,.35);--riv:rgba(60,120,200,.5);--ua:#3f82ea;--ru:#dc5a53;--ac:#c98a00;--ink:#17212b;--mu:#5d6b78;--glass:rgba(255,255,255,.88);--line:rgba(20,35,60,.14);--good:#1f7a45;--bad:#b3312c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea:#0b1220;--land:#222b37;--bd:rgba(0,0,0,.55);--riv:rgba(120,170,240,.4);--ua:#4f8ff2;--ru:#e4635c;--ac:#f2c14e;--ink:#e8edf7;--mu:#8f9cb6;--glass:rgba(15,21,33,.86);--line:rgba(255,255,255,.12);--good:#6fd39a;--bad:#f2837d}}
:root[data-theme="dark"]{--sea:#0b1220;--land:#222b37;--bd:rgba(0,0,0,.55);--riv:rgba(120,170,240,.4);--ua:#4f8ff2;--ru:#e4635c;--ac:#f2c14e;--ink:#e8edf7;--mu:#8f9cb6;--glass:rgba(15,21,33,.86);--line:rgba(255,255,255,.12);--good:#6fd39a;--bad:#f2837d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding:8px 12px}
#top h1{margin:0;font-size:16px}
#hs{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;color:var(--mu)}
#hs b{color:var(--ink)}
.pips{letter-spacing:3px;color:var(--ac)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:7px 11px}
button:hover:not(:disabled){border-color:var(--ac)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.p{background:var(--ac);border-color:var(--ac);color:#111;font-weight:700}
button.w{background:var(--ru);border-color:var(--ru);color:#fff;font-weight:700}
#panel{position:fixed;right:10px;top:calc(66px + env(safe-area-inset-top,0px));bottom:10px;width:310px;overflow:auto;padding:14px}
#panel h2{margin:0;font-size:19px}
.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}
.st{border:1px solid var(--line);border-radius:9px;padding:6px 9px}.st span{display:block;color:var(--mu);font-size:12px}.st b{font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.sec{margin:12px 0 4px;font-weight:700}
#log p{margin:4px 0;padding-left:8px;border-left:3px solid var(--line);font-size:13px}#log .g{border-color:var(--good)}#log .b{border-color:var(--bad)}
#zc{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
#zc button{width:42px;height:42px;font-size:18px;border-radius:0}
@media(max-width:820px){#panel{left:10px;right:10px;top:auto;width:auto;max-height:42vh}#zc{bottom:auto;top:120px}}
#ov{position:fixed;inset:0;background:rgba(8,12,16,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#ov .box{max-width:460px;padding:22px;text-align:center}
#ov h2{margin:0 0 8px}#ov .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button{min-height:36px}
input[type=range]{width:100%;accent-color:var(--ac)}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:10px 0}.sl input{grid-column:1/-1}
#ov .box.big{text-align:left;max-height:90vh;overflow:auto;width:min(520px,100%)}
@media(max-width:820px){#ov{align-items:flex-end;padding:0}#ov .box{border-radius:18px 18px 0 0;width:100%;max-width:none}button{min-height:42px}}
button svg{vertical-align:middle;margin-right:4px}
#hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;z-index:4;max-width:96vw}
#hud[hidden]{display:none}
#news{position:fixed;left:10px;width:min(430px,calc(100vw - 20px));padding:7px 10px;font-size:12px;line-height:1.35;cursor:pointer;max-height:118px;overflow:hidden;z-index:2}
#news[hidden]{display:none}
#news p{margin:2px 0;padding-left:6px;border-left:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#news .g,.nl.g{border-color:var(--good)}#news .b,.nl.b{border-color:var(--bad)}
.nl{margin:3px 0;padding-left:6px;border-left:3px solid var(--line)}
@media(min-width:821px){#news{width:min(430px,calc(100vw - 350px))}}
#ov.main{background:radial-gradient(circle at 25% 20%,rgba(63,130,234,.4),transparent 55%),radial-gradient(circle at 80% 85%,rgba(220,90,83,.35),transparent 55%),rgba(8,12,16,.9)}
.ttl{font-size:46px;font-weight:800;letter-spacing:10px;margin:0 0 6px;background:linear-gradient(90deg,#f2c14e,#e4635c);-webkit-background-clip:text;background-clip:text;color:transparent}
.mbt{display:flex;flex-direction:column;gap:10px;margin-top:18px}.mbt button{padding:13px;font-size:16px}
.mm{width:min(580px,100%);max-height:94vh;overflow:auto;padding:26px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;text-align:left;margin-top:12px}
.cc{display:block;text-align:left;padding:9px 10px 9px 14px;position:relative;overflow:hidden}.cc i{position:absolute;left:0;top:0;bottom:0;width:5px}.cc b{display:block}.cc span{display:block;font-size:12px;color:var(--mu)}
#pv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(520px,94vw);padding:14px 16px;z-index:3;text-align:center}
#pv[hidden]{display:none}#pv h2{margin:0 0 2px}
.sub{letter-spacing:4px;font-size:11px;color:var(--mu);margin-bottom:10px}
@keyframes gl{0%,100%{filter:drop-shadow(0 0 6px rgba(242,193,78,.35))}50%{filter:drop-shadow(0 0 18px rgba(228,99,92,.55))}}
.ttl{animation:gl 5s ease-in-out infinite}
.srch{width:100%;margin-top:10px;padding:10px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit}
.cc em{display:block;height:3px;border-radius:2px;background:var(--ac);margin-top:6px}
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.av{width:128px;height:128px;border-radius:26px;object-fit:cover;margin:0 auto 10px;display:block;box-shadow:0 0 30px rgba(228,99,92,.4),0 0 0 1px var(--line)}
.ttl{font-size:34px!important;letter-spacing:5px!important}
.gr{background:linear-gradient(135deg,rgba(242,193,78,.2),rgba(228,99,92,.15));border:1px solid rgba(242,193,78,.5);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.5;text-align:left}
.gr b{display:block;font-size:16px;color:var(--ac);margin-bottom:3px}
@media(max-width:820px){
#news{display:none!important}#top h1{display:none}#top{padding:6px 8px;gap:4px 8px}#hs{gap:2px 8px;font-size:13px}#hs>span:nth-child(3),#hs>span:nth-child(4){display:none}#hs button{padding:5px 7px;font-size:12.5px;min-height:34px}
#panel{max-height:42vh;max-height:42dvh;padding:10px}.grid{gap:5px}.st b{font-size:15px}
#zc{top:auto!important;bottom:calc(44vh + 10px);bottom:calc(44dvh + 10px)}#zc button{width:38px;height:38px}
.ttl{font-size:25px!important;letter-spacing:3px!important}.av{width:96px;height:96px}.mm{padding:18px}
}
#neg{position:fixed;left:10px;width:min(300px,calc(100vw - 20px));padding:8px 10px;font-size:13px;line-height:1.35;z-index:2}
#neg[hidden]{display:none}#neg>div+div{margin-top:8px}
.nb{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}.nb i{display:block;height:100%;background:var(--ac)}
#ac{position:fixed;left:50%;transform:translateX(-50%);width:min(340px,94vw);padding:10px 12px;z-index:3;text-align:center;font-size:14px}
