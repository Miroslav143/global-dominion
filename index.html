oth=Object.entries(fnd).filter(([id])=>!inbox[id]);
const el=$('#dl');if(!el)return;el.innerHTML=(peers.length?peers.map(row).join(''):'')+(oth.length?`<div class=gh style="padding:8px 16px 2px">Найдено по @username</div>${oth.map(row).join('')}`:'')||(k.length>=2?'<div class=emp>Никого не нашли по этому юзернейму</div>':'<div class=emp>Пока нет контактов.<br>Введите @username, чтобы найти человека в Zipo</div>')}
function chDir(){if(Date.now()-(chDir.t||0)>20000){chDir.t=Date.now();DB.collection('groups').where('ch','==',true).limit(30).get().then(s=>{chl=s.docs.map(d=>({id:d.id,...d.data()}));drawCh()}).catch(()=>{})}else drawCh()}
function drawCh(){const el=$('#chd');if(!el)return;const k=dq.replace('@','').trim(),a=chl.filter(g=>!k||(g.name||'').toLowerCase().includes(k));el.innerHTML=a.length?`<div class=gh style="padding:8px 16px 2px">Каналы</div>${a.map(g=>{const j=g.members.includes(ME.id),n=g.members.length;return`<div class=row data-a=chopen data-id=${g.id}>${av(g,48)}<div class=m><div class=n><span>${E(g.name)} ${ri(g)}</span></div><div class=l><span>${n} ${pl(n,'подписчик','подписчика','подписчиков')}</span></div></div>${j?'':`<button class=btn data-a=chsub data-id=${g.id} style="width:auto;padding:8px 14px">Подписаться</button>`}</div>`}).join('')}`:''}
async function joinTeam(){try{const id='g_ZipoTeam',r=await DB.doc('groups/'+id).get();if(!r.exists)return;L.ztj=1;save();const g={id,...r.data()};if(g.members.includes(ME.id)||g.members.length>=CHMAX)return;await memAdd(id,[...g.members,ME.id]);await DB.doc('inbox/'+ME.id+'/c/'+id).set({peer:id,g:1,t:Date.now(),lf:ME.id,lp:'Вы подписаны на канал',n:0,lr:Date.now()})}catch{}}
const memAdd=(id,mem)=>DB.doc('groups/'+id).update({members:(window.firebase&&firebase.firestore&&firebase.firestore.FieldValue)?firebase.firestore.FieldValue.arrayUnion(ME.id):mem});

Object.assign(ACT,{
wallet:()=>sheet(`<div class=pf><div style="font-size:54px">⚡</div><h2>${fmt(ME.stars||0)} зипов</h2><p>${isA(ME)?'⭐ Premium (администратор)':(+ME.prem||0)>Date.now()?'⭐ Premium до '+new Date(ME.prem).toLocaleDateString('ru'):'Валюта Zipo'}</p></div>${ME.bonus!=today()?'<button class=btn data-a=bonus>Забрать ежедневный бонус +20 ⚡</button>':'<div style="text-align:center;color:var(--tx2)">Бонус на сегодня уже получен</div>'}<div class=gh style="padding-left:2px">Пополнить зипы</div><div class=card style="margin:0">${['z1','z2','z3','z4'].map(dRow).join('')}</div><div class=gh style="padding-left:2px">⭐ Zipo Premium</div><div class=card style="margin:0">${['p1','p12'].map(dRow).join('')}</div><div style="color:var(--tx2);font-size:13px;line-height:1.5">Premium открывает кастомные анимированные эмодзи, стикеры и GIF. Группы, каналы, истории, видеокружки, «печатает», фон чата и баннер профиля бесплатны. Зипы также можно заработать: бонус +20 каждый день и огонёк серии.</div><button class="btn sec" data-a=zsend>Отправить зипы другу</button>`),
dpay:d=>{const it=PAYS[d.k];if(!it)return;sheet(`<h2>${it.t}</h2><div style="font-size:30px;font-weight:700">${it.p} ₴</div><div class=card style="margin:0;padding:14px"><div style="color:var(--tx2);font-size:13px">Карта для перевода</div><div style="font-size:21px;font-weight:600;letter-spacing:1px;margin:6px 0">${CARD.replace(/(\d{4})(?=\d)/g,'$1 ')}</div><button class="btn sec" data-a=ccopy style="padding:10px">Скопировать номер</button></div><ol style="padding-left:20px;line-height:1.7;color:var(--tx2);font-size:14px"><li>Переведите ${it.p} ₴ на эту карту.</li><li>В комментарии укажите ваш @${E(ME.username)}.</li><li>Нажмите «Я оплатил(а)». Администрация проверит платёж и начислит ${it.z?'зипы':'Premium'}.</li></ol><button class=btn data-a=dpaid data-k=${d.k}>Я оплатил(а)</button><button class="btn sec" data-a=wallet>Назад</button>`)},
ccopy:()=>{const f=()=>toast('Номер карты скопирован');navigator.clipboard?.writeText(CARD).then(f).catch(()=>toast(CARD))||toast(CARD)},
dpaid:async d=>{if(!PAYS[d.k])return;const s=await DB.collection('pays').where('u','==',ME.id).get();if(s.docs.filter(x=>x.data().st=='open').length>=3)return toast('У вас уже есть заявки на проверке. Подождите подтверждения');await DB.collection('pays').add({u:ME.id,name:ME.name,un:ME.username,k:d.k,t:Date.now(),st:'open'});closeS();toast('Заявка отправлена. Начисление после проверки платежа ✓')},
payok:async d=>{const r=pays.find(x=>x.id==d.id);if(!r)return;const it=PAYS[r.k];if(!it)return toast('Неизвестный пакет');const ud=await DB.doc('users/'+r.u).get();if(!ud.exists)return toast('Пользователь удалён');const u=ud.data(),upd={};if(it.z)upd.stars=(u.stars||0)+it.z;if(it.d)upd.prem=Math.max(Date.now(),+u.prem||0)+it.d*864e5;await DB.doc('users/'+r.u).update(upd);await DB.doc('pays/'+r.id).update({st:'done',by:ME.id,tt:Date.now()});await DB.collection('svc').add({to:r.u,kind:'note',t:Date.now(),text:'✅ Оплата подтверждена: '+it.t+'. Спасибо за поддержку Zipo!'});pushTo(r.u,{t:'Zipo',b:'✅ Оплата подтверждена: '+it.t,u:'',k:'msg'});toast('Выдано')},
payno:async d=>{const r=pays.find(x=>x.id==d.id);if(!r)return;await DB.doc('pays/'+r.id).update({st:'denied',by:ME.id,tt:Date.now()});await DB.collection('svc').add({to:r.u,kind:'note',t:Date.now(),text:'Оплата не подтверждена. Если вы платили, напишите Администрации.'});toast('Отклонено')},
aprem:d=>{const n=Math.floor(+prompt('На сколько дней выдать Premium? (0 — снять)','30'));if(isNaN(n))return;gdb('users/'+d.id,u=>DB.doc('users/'+d.id).update({prem:n>0?Math.max(Date.now(),+u.prem||0)+n*864e5:0}).then(()=>toast('Готово')).catch(dbErr))},
cie:d=>{if(!isPrem(ME))return premWall('Кастомные эмодзи доступны с Premium');const i=$('#in');if(!i)return;i.value+=':'+d.k+':';gb();i.focus()},
ss:d=>{if(!isPrem(ME))return premWall('Стикеры доступны с Premium');const x={st:d.e};/^ca-/.test(d.an||'')&&(x.an=d.an);send(x)},
gifp:()=>{if(!isPrem(ME))return premWall('GIF доступны с Premium');const i=document.createElement('input');i.type='file';i.accept='image/gif';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(!/^data:image\/gif;base64,/.test(r.result))return toast('Выберите GIF');if(r.result.length>215000)return toast('GIF слишком большой (до ~160 КБ)');L.gifs=[r.result,...(L.gifs||[]).filter(g=>g!=r.result)].slice(0,12);save();pan=null;panel('gif');send({im:r.result,gif:1})};r.readAsDataURL(f)};i.click()},
gifs:d=>{if(!isPrem(ME))return premWall('GIF доступны с Premium');const g=(L.gifs||[])[+d.i];g&&okI(g)&&send({im:g,gif:1})},
zsend:()=>{const a=Object.keys(inbox).filter(k=>!isG(k)).map(id=>[id,U(id)]).filter(([,u])=>u&&u.name&&u.name!='…').map(([id,u])=>`<button class=sh data-a=zto data-id=${id}>${av(u,36)} ${E(u.name)}</button>`).join('');sheet(`<h2>Кому отправить зипы?</h2>${a||'<div class=emp>Пока нет контактов.<br>Найдите человека по @username во вкладке «Контакты»</div>'}`)},
invite:d=>{L.iv=L.iv||{};if(Date.now()-(L.iv[d.id]||0)<36e5)return toast('Приглашение уже отправлено, подождите час');L.iv[d.id]=Date.now();save();ping(d.id,'зовёт вас в Zipo');toast('Приглашение отправлено 🔔')},
gnew:()=>sheet(`<h2>Создать</h2>${shb('gnewg','grp','Группу')}${shb('gnewc','chat','Канал')}`),gnewg:()=>{closeS();gPicker('new')},
gnewc:()=>sheet(`<h2>Новый канал</h2><input id=cn1 placeholder="Название канала" maxlength=40><input id=cn2 placeholder="Описание (необязательно)" maxlength=120><p style="color:var(--tx2);font-size:13px">В канале публикуете только вы. Подписаться может любой пользователь, канал виден во вкладке «Контакты».</p><button class=btn data-a=chok>Создать канал</button>`),
chok:async()=>{const n=($('#cn1').value||'').trim().slice(0,40);if(!n)return toast('Введите название');const id='g_'+rnd(10),g={name:n,desc:($('#cn2').value||'').trim().slice(0,120),owner:ME.id,admins:[],members:[ME.id],t:Date.now(),ch:true};await DB.doc('groups/'+id).set(g);groups[id]={...g,id};closeS();tab='chats';openChat(id);await send({x:'📢 Канал «'+n+'» создан'},id)},
chopen:async d=>{const g=chl.find(x=>x.id==d.id);if(g&&g.members.includes(ME.id)){tab='chats';return openChat(d.id)}return ACT.chsub(d)},
chsub:async d=>{const r=await DB.doc('groups/'+d.id).get();if(!r.exists)return toast('Канал не найден');const g={id:d.id,...r.data()};if(!g.members.includes(ME.id)){if(g.members.length>=CHMAX)return toast('В канале нет мест');g.members=[...g.members,ME.id];await memAdd(d.id,g.members)}groups[d.id]=g;await DB.doc('inbox/'+ME.id+'/c/'+d.id).set({peer:d.id,g:1,t:Date.now(),lf:ME.id,lp:'Вы подписались на канал',n:0,lr:Date.now()});chDir.t=0;tab='chats';openChat(d.id)},
gver:async d=>{if(ME.role!='owner')return toast('Только Владелец');const g=groups[d.id];if(!g)return;await DB.doc('groups/'+d.id).update({ver:!g.ver});g.ver=!g.ver;gInfo(d.id)},
chmk:async()=>{if(ME.role!='owner')return toast('Только Владелец');const id='g_ZipoTeam',ex=await DB.doc('groups/'+id).get();if(ex.exists){groups[id]=groups[id]||{id,...ex.data()};return toast('Канал Zipo Team уже создан')}
const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');x.fillStyle='#7b83eb';x.beginPath();x.roundRect?x.roundRect(0,0,200,200,44):x.rect(0,0,200,200);x.fill();x.strokeStyle='#fff';x.lineWidth=17;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(62,56);x.lineTo(138,56);x.lineTo(62,144);x.lineTo(138,144);x.stroke();
const g={name:'Zipo Team',desc:'Официальные новости и обновления Zipo',owner:ME.id,admins:[],members:[ME.id],t:Date.now(),ch:true,ver:true,img:c.toDataURL('image/png')};await DB.doc('groups/'+id).set(g);groups[id]={...g,id};await send({x:'Добро пожаловать в Zipo Team! 👋 Здесь мы публикуем новости и обновления Zipo.'},id);toast('Канал Zipo Team создан ✓')}
});

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)try{const r=ACT[t.dataset.a]?.(t.dataset);r?.catch?.(dbErr)}catch(x){dbErr(x)}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);boot();if('serviceWorker' in navigator&&location.protocol=='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script></body></html>
